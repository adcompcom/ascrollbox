<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Open Graph — WhatsApp / Telegram preview -->
  <meta property="og:site_name" content="Ascrollbox"/>
  <meta property="og:title" content="Pack compartido en Ascrollbox"/>
  <meta property="og:description" content="Alguien te compartió un pack de videos. Ábrelo en Ascrollbox."/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="https://ascrollbox.web.app/og.png"/>

  <title>Ascrollbox</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 16px;
      display: block;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    .code-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #6C47FF;
      margin-bottom: 8px;
    }

    .code {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #6C47FF;
      background: #f0ebff;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }

    .btn-primary {
      background: #6C47FF;
      color: #fff;
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: #f0ebff;
      color: #6C47FF;
    }

    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://ascrollbox.web.app/icon.png" alt="Ascrollbox"/>
    <h1>Ascrollbox</h1>
    <p class="subtitle">Te compartieron un pack de videos</p>

    <p class="code-label">Código del pack</p>
    <div class="code" id="code">——</div>

    <button class="btn btn-primary" id="openBtn">Abrir en Ascrollbox</button>
    <a class="btn btn-secondary"
       href="https://play.google.com/store/apps/details?id=com.ascrollbox.ascrollbox"
       target="_blank">
      Descargar Ascrollbox
    </a>

    <p class="hint">
      Si ya tienes la app instalada, toca "Abrir en Ascrollbox".<br/>
      Si no, descárgala gratis en Google Play.
    </p>
  </div>

  <script>
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var code = (parts[parts.length - 1] || '').toUpperCase();

      if (code) {
        document.getElementById('code').textContent = code;
        document.title = 'Pack ' + code + ' · Ascrollbox';
      }

      // "Abrir" button: try custom scheme first (works in WhatsApp WebView),
      // then Android intent URL as fallback (works in Chrome and other browsers).
      // If the app is not installed, the fallback_url redirects to Play Store.
      document.getElementById('openBtn').addEventListener('click', function () {
        var playStore = 'https://play.google.com/store/apps/details?id=com.ascrollbox.ascrollbox';

        // Android intent URL — works from Chrome and WhatsApp in-app browser
        var intentUrl =
          'intent://pack/' + code +
          '#Intent' +
          ';scheme=ascrollbox' +
          ';package=com.ascrollbox.ascrollbox' +
          ';S.browser_fallback_url=' + encodeURIComponent(playStore) +
          ';end';

        // Try the custom scheme directly (fastest path from any WebView)
        var customScheme = 'ascrollbox://pack/' + code;

        // Use the intent URL which handles both "app installed" and "not installed" cases
        window.location.href = intentUrl;

        // Fallback: if intent URL doesn't fire within 1.5s, redirect to Play Store
        setTimeout(function () {
          window.location.href = playStore;
        }, 1500);
      });
    })();
  </script>
</body>
</html>
